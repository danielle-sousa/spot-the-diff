<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Banco Demo</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header>Banco Demo</header>
  <main>
    <section class="card">
      <p>Saldo disponível</p>
      <p class="balance">R$ 1.234,56</p>
      <p class="updated-at" id="updated-at">Atualizado às <span></span></p>
      <button class="button">Transferir</button>
    </section>
  </main>
  <script>document.querySelector('#updated-at span').textContent = new Date().toLocaleTimeString('pt-BR');</script>
</body>
</html>
